name: Quant unit tests

on:
  pull_request:
    paths: ['quant/**', 'pytest.ini', '.github/workflows/quant-tests.yml']
  push:
    paths: ['quant/**', 'pytest.ini', '.github/workflows/quant-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant/requirements.txt
      - run: python -m pip install -r quant/requirements.txt
      - run: python -m pytest quant/tests -m "not integration" -q
