name: Quant unit tests

on:
  pull_request:
    paths: ['quant/**', 'scripts/*quant*.ps1', '.env.example', 'pytest.ini', '.github/workflows/quant-tests.yml']
  push:
    paths: ['quant/**', 'scripts/*quant*.ps1', '.env.example', 'pytest.ini', '.github/workflows/quant-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Quant unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            quant/requirements.txt
            quant/requirements-research.txt
      - run: python -m pip install -r quant/requirements-research.txt
      - run: python -m pip check
      - run: python -m compileall -q quant
      - run: git diff --check HEAD^ HEAD -- quant .github/workflows/quant-tests.yml
      - run: python -m pytest --collect-only quant -q
      - run: python -m pytest quant -m "not integration" -q --junitxml=reports/unit-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-unit-evidence
          path: reports/unit-tests.xml
