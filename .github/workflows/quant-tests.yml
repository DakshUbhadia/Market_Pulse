name: Quant unit tests

on:
  pull_request:
    paths: ['quant/**', 'scripts/*quant*.ps1', '.env.example', 'pytest.ini', '.github/workflows/quant-tests.yml']
  push:
    paths: ['quant/**', 'scripts/*quant*.ps1', '.env.example', 'pytest.ini', '.github/workflows/quant-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Quant unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quant/requirements.txt
      - run: python -m pip install -r quant/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q quant
      - run: python -m pytest quant -m "not integration" -q
